<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SSI Landscape — Interactive Reference 2025</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='22' font-size='18' text-anchor='middle' font-family='monospace' fill='white' font-weight='bold'>S</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #fff; --bg1: #f8fafc; --bg2: #f1f5f9; --bg3: #e8eef6; --bg4: #dde6f0;
  --blue: #2563eb; --blue-dim: rgba(37,99,235,.09);
  --green: #059669; --amber: #d97706; --red: #dc2626; --cyan: #0891b2; --violet: #7c3aed;
  --slate: #64748b; --ink: #0f172a;
  --border: rgba(0,0,0,.08); --border2: rgba(0,0,0,.13);
  --sans: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
  --r: 6px; --r-lg: 10px;
}
html, body { min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.6; overflow-x: hidden; }

/* TOPBAR */
.topbar { padding: 1rem 2rem; background: var(--bg1); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 60; backdrop-filter: blur(12px); }
.logo { font-family: var(--mono); font-size: .85rem; font-weight: 600; color: var(--blue); letter-spacing: .12em; text-transform: uppercase; }
.topbar-meta { font-size: .78rem; color: var(--slate); display: flex; align-items: center; gap: 1rem; }
.topbar-badge { font-family: var(--mono); font-size: .62rem; padding: .2rem .55rem; border-radius: 100px; background: rgba(5,150,105,.1); color: #059669; border: 1px solid rgba(5,150,105,.25); }

/* LOADING */
.loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 1rem; }
.spinner { width: 36px; height: 36px; border: 3px solid var(--bg3); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-family: var(--mono); font-size: .8rem; color: var(--slate); }
.error-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: .75rem; }
.error-box { background: var(--bg1); border: 1px solid rgba(220,38,38,.2); border-radius: var(--r-lg); padding: 1.5rem 2rem; text-align: center; max-width: 480px; }
.error-box h3 { color: var(--red); font-size: .9rem; margin-bottom: .5rem; }
.error-box p { font-size: .8rem; color: var(--slate); }

/* PRIMARY NAV */
.primary-nav { display: flex; border-bottom: 2px solid var(--border2); background: var(--bg1); padding: 0 2rem; position: sticky; top: 57px; z-index: 55; overflow-x: auto; scrollbar-width: none; }
.primary-nav::-webkit-scrollbar { display: none; }
.pnav-btn { display: flex; align-items: center; gap: .5rem; padding: .9rem 1.5rem; background: none; border: none; cursor: pointer; font-family: var(--sans); font-size: .82rem; font-weight: 600; color: var(--slate); white-space: nowrap; border-bottom: 2px solid transparent; position: relative; bottom: -2px; transition: color .15s, border-color .15s; }
.pnav-btn:hover { color: var(--ink); }
.pnav-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
.pnav-count { font-family: var(--mono); font-size: .6rem; padding: .1rem .38rem; border-radius: 100px; background: var(--bg3); color: var(--slate); font-weight: 600; }
.pnav-btn.active .pnav-count { background: var(--blue-dim); color: var(--blue); }

/* SHELL & PANELS */
.shell { max-width: 1440px; margin: 0 auto; padding: 0 2rem 4rem; }
.primary-panel { display: none; padding-top: 2rem; animation: fadeUp .18s ease; }
.primary-panel.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* SECTION HEADER */
.section-header { margin-bottom: 1.4rem; }
.eyebrow { font-family: var(--mono); font-size: .63rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin-bottom: .3rem; display: flex; align-items: center; gap: .4rem; }
.eyebrow::before { content: ''; width: 14px; height: 1px; background: var(--blue); }
.sec-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
.sec-desc { font-size: .8rem; color: var(--slate); margin-top: .3rem; max-width: 700px; line-height: 1.65; }

/* STAT CARDS */
.dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
.stat-card { background: var(--bg1); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1.25rem 1.5rem; position: relative; overflow: hidden; }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent, var(--blue)); }
.stat-num { font-size: 2rem; font-weight: 700; font-family: var(--mono); letter-spacing: -.03em; color: var(--ink); line-height: 1; }
.stat-label { font-size: .7rem; color: var(--slate); text-transform: uppercase; letter-spacing: .09em; margin-top: .35rem; font-weight: 600; }
.stat-sub { font-size: .68rem; color: #94a3b8; margin-top: .2rem; }
.dash-two { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
.dash-card { background: var(--bg1); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1.4rem; }
.dash-card-title { font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); margin-bottom: 1rem; display: flex; align-items: center; gap: .4rem; font-family: var(--mono); }
.dash-card-title::before { content: ''; width: 12px; height: 1px; background: currentColor; opacity: .5; }
.legend-grid { display: flex; flex-direction: column; gap: .55rem; }
.legend-row { display: flex; align-items: center; gap: .65rem; font-size: .78rem; color: #334155; }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.legend-count { font-family: var(--mono); font-size: .68rem; color: #94a3b8; margin-left: auto; }
.pb-row { display: flex; align-items: center; gap: .6rem; font-size: .77rem; margin-bottom: .5rem; }
.pb-bar-wrap { flex: 1; height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
.pb-bar { height: 100%; border-radius: 2px; }
.pb-val { font-family: var(--mono); font-size: .68rem; color: var(--slate); min-width: 20px; text-align: right; }
.insight-list { list-style: none; display: flex; flex-direction: column; gap: .6rem; }
.insight-li { display: flex; gap: .65rem; align-items: flex-start; font-size: .79rem; color: #334155; line-height: 1.55; }
.ins-icon { width: 16px; height: 16px; min-width: 16px; border-radius: 3px; background: var(--blue-dim); color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: .6rem; margin-top: 2px; border: 1px solid rgba(37,99,235,.15); }

/* FILTER STACK */
.filter-stack { margin-bottom: 1.6rem; }
.filter-stack > .sub-filter { border-radius: var(--r-lg) var(--r-lg) 0 0; margin-bottom: 0; }
.sub-filter { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; background: var(--bg1); border: 1px solid var(--border); border-radius: var(--r-lg); padding: .7rem 1rem; margin-bottom: 1.6rem; }
.sf-label { font-family: var(--mono); font-size: .65rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--slate); white-space: nowrap; margin-right: .2rem; }
.sf-divider { width: 1px; height: 22px; background: var(--border2); margin: 0 .4rem; flex-shrink: 0; }
.sf-btn { display: flex; align-items: center; gap: .4rem; padding: .32rem 1rem; border-radius: 100px; font-size: .8rem; font-weight: 600; border: 1px solid transparent; background: transparent; color: var(--slate); cursor: pointer; transition: all .15s; font-family: var(--sans); white-space: nowrap; }
.sf-btn:hover { background: var(--bg2); color: var(--ink); border-color: var(--border2); }
.sf-btn.sf-agnostic.active { background: #ecfdf5; color: #065f46; border-color: rgba(5,150,105,.4); }
.sf-btn.sf-specific.active { background: #fffbeb; color: #92400e; border-color: rgba(217,119,6,.4); }
.sf-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sf-count { margin-left: auto; font-family: var(--mono); font-size: .7rem; color: var(--slate); white-space: nowrap; }
.sf-count strong { color: var(--blue); }
.sf-search { padding: .35rem .8rem; border-radius: var(--r); border: 1px solid var(--border2); background: #fff; font-family: var(--sans); font-size: .78rem; color: var(--ink); outline: none; width: 195px; transition: border-color .15s; }
.sf-search:focus { border-color: var(--blue); }
.col-filter { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--r-lg) var(--r-lg); padding: .55rem 1rem; margin-bottom: 1.6rem; }
.cf-label { font-family: var(--mono); font-size: .62rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--slate); white-space: nowrap; margin-right: .2rem; }
.cf-btn { padding: .24rem .75rem; border-radius: 100px; font-size: .72rem; font-weight: 500; border: 1px solid var(--border2); background: white; color: #475569; cursor: pointer; transition: all .14s; font-family: var(--sans); white-space: nowrap; }
.cf-btn:hover { border-color: rgba(37,99,235,.35); color: var(--blue); }
.cf-btn.active { background: var(--blue-dim); border-color: rgba(37,99,235,.35); color: #1e40af; font-weight: 600; }

/* TABLE */
.tbl-wrap { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 2rem; }
table { width: 100%; border-collapse: collapse; font-size: .78rem; }
thead tr { background: var(--bg3); }
th { padding: .65rem 1rem; text-align: left; color: #475569; font-weight: 600; font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; border-bottom: 1px solid var(--border2); font-family: var(--mono); }
td { padding: .65rem 1rem; border-top: 1px solid var(--border); vertical-align: top; line-height: 1.5; color: #334155; }
tr:hover td { background: rgba(37,99,235,.03); }
/* Fix sticky label cell overlap on hover */
.matrix-table tr:hover .frow-label {
  background: #eef2fb;
}
.matrix-table .frow-label {
  background: var(--bg1);
  z-index: 3;
}
.matrix-table .fcat-header {
  background: var(--bg3);
  z-index: 3;
}
td:first-child { font-weight: 600; color: var(--ink); white-space: nowrap; }
td.num { text-align: center; font-family: var(--mono); font-size: .65rem; color: #94a3b8; font-weight: 500; width: 32px; padding: .65rem .5rem; white-space: nowrap; }
th.num-col { width: 32px; text-align: center; }
td.notes { font-size: .74rem; color: var(--slate); max-width: 240px; }
.no-rows { padding: 2rem; text-align: center; color: var(--slate); font-size: .82rem; font-family: var(--mono); display: none; }

/* BADGES */
.b { display: inline-flex; align-items: center; padding: .14rem .48rem; border-radius: 100px; font-size: .62rem; font-weight: 600; font-family: var(--mono); white-space: nowrap; line-height: 1.4; }
.b-green { background: rgba(5,150,105,.1); color: #065f46; border: 1px solid rgba(5,150,105,.25); }
.b-amber { background: rgba(217,119,6,.1); color: #92400e; border: 1px solid rgba(217,119,6,.25); }
.b-blue { background: rgba(37,99,235,.09); color: #1e40af; border: 1px solid rgba(37,99,235,.2); }
.b-cyan { background: rgba(8,145,178,.1); color: #164e63; border: 1px solid rgba(8,145,178,.2); }
.b-slate { background: rgba(100,116,139,.1); color: #334155; border: 1px solid rgba(100,116,139,.2); }
.b-red { background: rgba(220,38,38,.09); color: #991b1b; border: 1px solid rgba(220,38,38,.2); }
.b-violet { background: rgba(124,58,237,.1); color: #4c1d95; border: 1px solid rgba(124,58,237,.2); }
a.lnk { display: inline-flex; align-items: center; color: #1e40af; text-decoration: none; font-size: .72rem; font-family: var(--mono); padding: .14rem .45rem; border-radius: 4px; background: var(--blue-dim); border: 1px solid rgba(37,99,235,.18); transition: all .15s; white-space: nowrap; }
a.lnk:hover { background: rgba(37,99,235,.14); border-color: rgba(37,99,235,.3); }
.lp { font-family: var(--mono); font-size: .6rem; padding: .1rem .4rem; border-radius: 3px; background: rgba(124,58,237,.08); color: #4c1d95; border: 1px solid rgba(124,58,237,.18); white-space: nowrap; display: inline-block; margin-top: .15rem; }

/* MEGA TITLES */
.mega-title-row td { padding: 0 !important; }
.mega-title-row { width: 100%; }
.mega-title {
  padding: 1rem 1.4rem !important;
  font-size: .85rem;
  font-weight: 700;
  letter-spacing: .01em;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: .6rem;
  border-top: 3px solid;
  width: 100%;
}
.mega-title.tech-mega {
  background: linear-gradient(90deg, #eff6ff, #f8fafc);
  color: #1e40af;
  border-color: #2563eb;
}
.mega-title.compliance-mega {
  background: linear-gradient(90deg, #fef2f2, #f8fafc);
  color: #991b1b;
  border-color: #dc2626;
}
.mega-icon { font-size: 1rem; }
.mega-sub {
  font-size: .68rem;
  font-weight: 400;
  opacity: .7;
  font-family: var(--sans);
  letter-spacing: 0;
}

/* MATRIX COLUMN CATEGORY STRIPES */
/* Agnostic = green top border, Specific = amber top border (already done) */
/* Feature row group colors */
.fcat-header.cat-w3c     { border-left: 4px solid #2563eb; }
.fcat-header.cat-dif     { border-left: 4px solid #059669; }
.fcat-header.cat-openid  { border-left: 4px solid #7c3aed; }
.fcat-header.cat-toip    { border-left: 4px solid #0891b2; }
.fcat-header.cat-owf     { border-left: 4px solid #d97706; }
.fcat-header.cat-privacy { border-left: 4px solid #dc2626; }
.fcat-header.cat-security{ border-left: 4px solid #475569; }
.fcat-header.cat-eidas   { border-left: 4px solid #1d4ed8; }
.fcat-header.cat-mobile  { border-left: 4px solid #9333ea; }
.fcat-header.cat-cred    { border-left: 4px solid #0891b2; }
.fcat-header.cat-deploy  { border-left: 4px solid #059669; }
.fcat-header.cat-wallet  { border-left: 4px solid #d97706; }
.fcat-header.cat-comp    { border-left: 4px solid #dc2626; }

/* Legend pills */
.legend-pill {
  display: inline-flex; align-items: center; gap: .35rem;
  padding: .2rem .6rem; border-radius: 100px;
  font-size: .65rem; font-weight: 600; font-family: var(--mono);
  border: 1px solid currentColor; opacity: .85;
}

/* Feature Comparison search + filter bar */
.matrix-filter-bar {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  background: var(--bg1); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: .7rem 1rem; margin-bottom: 1rem;
}
.matrix-filter-bar .sf-label {
  font-family: var(--mono); font-size: .65rem; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--slate);
}
.mf-btn {
  padding: .28rem .75rem; border-radius: 100px; font-size: .72rem;
  font-weight: 500; border: 1px solid var(--border2);
  background: white; color: #475569; cursor: pointer;
  transition: all .14s; font-family: var(--sans); white-space: nowrap;
}
.mf-btn:hover { border-color: rgba(37,99,235,.35); color: var(--blue); }
.mf-btn.active { background: var(--blue-dim); border-color: rgba(37,99,235,.35); color: #1e40af; font-weight: 600; }

/* References table in DevTools */
.ref-section { margin-top: 2.5rem; }
.ref-section-title {
  font-family: var(--mono); font-size: .65rem; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--slate);
  margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem;
  padding-bottom: .5rem; border-bottom: 1px solid var(--border);
}
.ref-section-title::before { content: ''; width: 3px; height: 14px; background: var(--blue); border-radius: 2px; }
.ref-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: .75rem;
}
.ref-card {
  background: var(--bg1); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 1rem 1.1rem;
  display: flex; flex-direction: column; gap: .3rem;
}
.ref-card-title { font-size: .8rem; font-weight: 600; color: var(--ink); }
.ref-card-sub { font-size: .72rem; color: var(--slate); line-height: 1.5; }
.ref-card-link { font-size: .7rem; font-family: var(--mono); }
.ref-card-tags { display: flex; gap: .25rem; flex-wrap: wrap; margin-top: .25rem; }

/* MATRIX */

.cmp-controls { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
.cmp-search { padding: .35rem .8rem; border-radius: var(--r); border: 1px solid var(--border2); background: #fff; font-family: var(--sans); font-size: .78rem; color: var(--ink); outline: none; width: 220px; transition: border-color .15s; }
.cmp-search:focus { border-color: var(--blue); }
.cmp-toggle { display: flex; align-items: center; gap: .35rem; font-size: .75rem; color: var(--slate); cursor: pointer; }
.cmp-toggle input { accent-color: var(--blue); }
.cmp-legend { display: flex; align-items: center; gap: .85rem; margin-left: auto; font-size: .7rem; color: var(--slate); flex-wrap: wrap; }
.cml-item { display: flex; align-items: center; gap: .3rem; }
.matrix-wrap { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.matrix-table { border-collapse: collapse; font-size: .72rem; width: 100%; }
.matrix-table th, .matrix-table td { border: 1px solid var(--border); }
.frow-label { padding: .5rem .85rem; background: var(--bg1); font-weight: 600; color: var(--ink); white-space: nowrap; min-width: 210px; position: sticky; left: 0; z-index: 3; border-right: 2px solid var(--border2); }
.fcat-header { padding: .38rem .85rem; background: var(--bg3); font-weight: 700; color: #1e293b; font-size: .64rem; letter-spacing: .09em; text-transform: uppercase; font-family: var(--mono); position: sticky; left: 0; z-index: 3; border-right: 2px solid var(--border2); }
.prov-head { padding: .4rem .3rem; text-align: center; background: var(--bg2); font-weight: 600; color: #1e293b; font-size: .62rem; writing-mode: vertical-lr; transform: rotate(180deg); min-width: 44px; max-width: 56px; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
.prov-head.agnostic { border-top: 3px solid var(--green); }
.prov-head.specific { border-top: 3px solid var(--amber); }
.cell { padding: .38rem; text-align: center; vertical-align: middle; }
.cell-yes { background: rgba(5,150,105,.07); }
.cell-no { background: rgba(0,0,0,.015); }
.cell-partial { background: rgba(217,119,6,.07); }
.icon-yes { color: #059669; font-size: .85rem; }
.icon-no { color: #d1d5db; font-size: .85rem; }
.icon-partial { color: #d97706; font-size: .82rem; }
/* PARTIAL TOOLTIPS — floating, appended to body to escape overflow:auto */
#ssi-tooltip {
  display: none;
  position: fixed;
  background: #1e293b;
  color: #f1f5f9;
  font-size: .72rem;
  font-family: var(--sans);
  line-height: 1.55;
  padding: .5rem .75rem;
  border-radius: 7px;
  width: 240px;
  white-space: normal;
  z-index: 9999;
  pointer-events: none;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
  text-align: left;
}
#ssi-tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: #1e293b;
}
.icon-partial { cursor: help; display: inline-block; padding: 3px 5px; }

.matrix-corner { background: var(--bg2); position: sticky; left: 0; top: 0; z-index: 6; border-right: 2px solid var(--border2); padding: .5rem .85rem; font-size: .62rem; font-weight: 700; color: var(--slate); font-family: var(--mono); text-transform: uppercase; letter-spacing: .07em; }

@media (max-width: 1024px) { .dash-grid { grid-template-columns: 1fr 1fr; } .dash-two { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .dash-grid { grid-template-columns: 1fr; } .shell { padding: 0 1rem 3rem; } }
</style>
</head>

<div class="topbar">
  <div class="logo">SSI//Map</div>
  <div class="topbar-meta">
    <span>Self-Sovereign Identity &mdash; Market Reference</span>
    <span class="topbar-badge">&#9679; Live from Supabase</span>
  </div>
</div>

<div id="app">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Loading SSI data&hellip;</div>
  </div>
</div>

<script>

const headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

async function query(table, params = '') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers });
  if (!res.ok) throw new Error(`${table}: ${res.status} ${res.statusText}`);

// ── LOAD ALL DATA ─────────────────────────────────────────────────────────────
async function loadData() {
  const [providers, features, matrix] = await Promise.all([
    query('providers', 'select=*&order=sort_order&active=eq.true'),
    query('features',  'select=*&order=sort_order'),
    query('feature_matrix', 'select=provider_id,feature_id,support,tooltip')
  ]);
  return { providers, features, matrix };
}

// ── RENDER HELPERS ────────────────────────────────────────────────────────────
function badge(text, cls) {
  return `<span class="b ${cls}">${text}</span>`;
}

function ledgerBadge(model) {
  return model === 'agnostic'
    ? badge('Agnostic', 'b-green')
    : badge('Specific', 'b-amber');
}

function categoryBadge(cat) {
  return cat === 'product'
    ? badge('Product', 'b-blue')
    : badge('Dev Tool', 'b-cyan');
}

function lnk(url, label) {
  if (!url) return '&mdash;';
  return `<a class="lnk" href="${url}" target="_blank">${label} &#8599;</a>`;
}

function lp(text) {
  return text ? `<span class="lp">${text}</span>` : '&mdash;';
}

function supportIcon(s) {
  if (s === 'yes')     return '<span class="icon-yes">&#9989;</span>';
  if (s === 'partial') return '<span class="icon-partial">&#9675;</span>';
  return '<span class="icon-no">&mdash;</span>';
}


function supportCell(s, tip) {
  const cls = s === 'yes' ? 'cell-yes' : s === 'partial' ? 'cell-partial' : 'cell-no';
  if (s === 'partial') {
    const tipText = (tip && tip.trim()) ? tip.trim() : '';
    const safe = tipText.replace(/\\/g, '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const tipAttr = safe ? ` data-tip="${safe}"` : '';
    return `<td class="cell ${cls}"><span class="icon-partial"${tipAttr}>&#9675;</span></td>`;
  }
  return `<td class="cell ${cls}">${supportIcon(s)}</td>`;
}

// ── FILTER ENGINE ─────────────────────────────────────────────────────────────
const state = {
  summary:  { ledger: 'agnostic', col: 'all', q: '' },
  products: { ledger: 'agnostic', col: 'all', q: '' },
  devtools: { ledger: 'agnostic', col: 'all', q: '' },
};

function runFilter(section) {
  const s = state[section];
  const tableId = section === 'summary' ? 'summary-table'
                : section === 'products' ? 'products-table' : 'devtools-table';
  const table = document.getElementById(tableId);
  if (!table) return;

  let vis = 0, total = 0, rowNum = 0;
  table.querySelectorAll('tbody tr').forEach(tr => {
    const ledger    = tr.dataset.ledger    || '';
    const col       = (tr.dataset.col      || '').toLowerCase();
    const name      = (tr.dataset.name     || '').toLowerCase();
    const cat       = tr.dataset.cat       || '';
    const keyTypes  = (tr.dataset.keytypes || '').toLowerCase();

    // For summary, col chips 'type-product'/'type-devtool' map to cat filter
    const catFilter = section === 'summary'
      ? (s.col === 'type-product' ? 'product' : s.col === 'type-devtool' ? 'devtool' : null)
      : null;

    const keyTypeChips = ['ed25519','secp256k1','p-256','bls12-381','rsa'];
    const isKeyChip = keyTypeChips.includes(s.col);
    const ledOk = ledger === s.ledger;
    const catOk = !catFilter || cat === catFilter;
    const epChips = ['oid4vci','oid4vp','didcomm','vc-api','chapi'];
    const isEpChip = epChips.includes(s.col);
    const exchProto = (tr.dataset.exchproto || '').toLowerCase();
    const colOk = s.col === 'all' || s.col === 'type-product' || s.col === 'type-devtool'
      || (isKeyChip ? keyTypes.includes(s.col)
        : isEpChip  ? exchProto.includes(s.col)
        : col.includes(s.col));
    const qOk   = !s.q || name.includes(s.q);

    const show = ledOk && catOk && colOk && qOk;
    tr.style.display = show ? '' : 'none';

    if (ledOk) total++;
    if (show) {
      vis++;
      rowNum++;
      // JS-based numbering — works for dynamically rendered rows
      const numCell = tr.querySelector('td.num');
      if (numCell) numCell.textContent = rowNum;
    } else {
      // Clear number on hidden rows so they don't show stale numbers if re-shown
      const numCell = tr.querySelector('td.num');
      if (numCell) numCell.textContent = '';
    }
  });

  const countEl = document.getElementById(`sf-${section}-count`);
  if (countEl) countEl.innerHTML = `Showing <strong>${vis}</strong> of ${total}`;
}

let _matrixGroupFilter = 'all';
let _matrixSearchFilter = '';

function filterMatrixGroup(group, btn) {
  _matrixGroupFilter = group;
  document.querySelectorAll('.mf-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  _applyMatrixFilters();
}

function filterMatrix(val) {
  _matrixSearchFilter = val.toLowerCase().trim();
  _applyMatrixFilters();
}

function _applyMatrixFilters() {
  const groupMap = {
    'W3C':     ['W3C DID Standards','W3C VC Standards','DID & Identity','DID & Identity Infrastructure','Credential Standards'],
    'DIF':     ['DIF Specifications','Protocols & APIs'],
    'OpenID':  ['OpenID Foundation'],
    'Privacy': ['Privacy & Data Protection','Privacy & Cryptography'],
    'Security':['Security Certifications'],
    'EU':      ['EU Digital Identity','Compliance & Governance'],
    'Mobile':  ['Mobile & Device Security','Wallet & UX','Deployment & Operations'],
    'Trust':   ['Trust Over IP Foundation','OpenWallet Foundation'],
  };
  const allowedGroups = _matrixGroupFilter === 'all' ? null : (groupMap[_matrixGroupFilter] || []);
  let currentGroupVisible = true;

  document.querySelectorAll('#matrix-body .mrow').forEach(tr => {
    // Always show mega-title rows
    if (tr.classList.contains('mega-title-row')) { tr.style.display = ''; return; }
    const header = tr.querySelector('.fcat-header');
    if (header) {
      const grp = header.textContent.trim();
      currentGroupVisible = !allowedGroups || allowedGroups.includes(grp);
      tr.style.display = currentGroupVisible ? '' : 'none';
      return;
    }
    if (!currentGroupVisible) { tr.style.display = 'none'; return; }
    const text = (tr.dataset.feature || '') + ' ' + ((tr.querySelector('.frow-label') || {}).textContent || '');
    tr.style.display = (!_matrixSearchFilter || text.toLowerCase().includes(_matrixSearchFilter)) ? '' : 'none';
  });
}

// ── FLOATING TOOLTIP ─────────────────────────────────────────────────────────
const tipEl = document.createElement('div');
tipEl.id = 'ssi-tooltip';
document.body.appendChild(tipEl);

function attachTooltips() {
  // Use event delegation so it works for all dynamically rendered elements
  document.addEventListener('mouseenter', function(e) {
    const t = e.target.closest('[data-tip]');
    if (!t) return;
    tipEl.textContent = t.dataset.tip;
    tipEl.style.display = 'block';
    moveTip(e);
  }, true);

  document.addEventListener('mousemove', function(e) {
    if (tipEl.style.display === 'none') return;
    if (!e.target.closest('[data-tip]')) return;
    moveTip(e);
  });

  document.addEventListener('mouseleave', function(e) {
    const t = e.target.closest('[data-tip]');
    if (!t) return;
    tipEl.style.display = 'none';
  }, true);
}

function moveTip(e) {
  const pad = 14, tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = e.clientX - tw / 2;
  let y = e.clientY - th - pad;
  if (x < pad) x = pad;
  if (x + tw > window.innerWidth - pad) x = window.innerWidth - tw - pad;
  if (y < pad) y = e.clientY + pad + 10;
  tipEl.style.left = x + 'px';
  tipEl.style.top  = y + 'px';
}

function toggleHideUnsupported() {
  const hide = document.getElementById('hide-unsupported').checked;
  document.querySelectorAll('#matrix-body .mrow').forEach(tr => {
    if (tr.classList.contains('mega-title-row')) return;
    if (tr.querySelector('.fcat-header')) return;
    if (!hide) { tr.style.display = ''; return; }
    tr.style.display = tr.querySelectorAll('.icon-yes').length === 0 ? 'none' : '';
  });
}

  function checkIcon(support) {

      if (support === 'partial') return '<span style="color:#d97706;font-size:.9rem">&#9675;</span>';
      return '<span style="color:#d1d5db">&#8212;</span>';
    }

    // Products that use this devtool (from col_tags or maintained_by hints)
    const usedBy = providers.filter(pr =>

      // simple heuristic: same ledger model
      pr.ledger_model === p.ledger_model
    ).map(pr => pr.name).slice(0,3).join(', ') || '&mdash;';

        const toolTypeBadge = p.tool_type ? '<span class="b b-cyan">' + p.tool_type + '</span>' : '&mdash;';
    return `<tr data-ledger="${p.ledger_model}" data-cat="devtool" data-col="${p.col_tags||''}" data-name="${p.name.toLowerCase()}" data-keytypes="${(p.key_types||''). toLowerCase()}" data-exchproto="${(p.exchange_protocols||'').toLowerCase()}">

    'Trust Over IP Foundation', 'OpenWallet Foundation',

  function filterBar(section, agN, spN) {

    renderApp(data);
    // Attach tooltip events after render
    setTimeout(attachTooltips, 100);
  })
  .catch(err => {
    document.getElementById('app').innerHTML = `
      <div class="error-screen">
        <div class="error-box">
          <h3>&#9888; Failed to load data</h3>
          <p>${err.message}</p>
          <p style="margin-top:.5rem;font-size:.72rem;font-family:var(--mono);color:#94a3b8">Check your Supabase URL and API key.</p>
        </div>
      </div>`;
  });
</script>
</body>
</html>
